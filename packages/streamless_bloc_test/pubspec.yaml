version: 0.1.0
repository: https://github.com/yourusername/streamless_bloc

environment:
  sdk: ^3.10.0

dependencies:
  diff_match_patch: ^0.4.1
  meta: ^1.14.0
  mocktail: ^1.0.0
  streamless_bloc:
  test: ^1.30.0

dev_dependencies:
  lints: ^5.0.0
  streamless_bloc_concurrency:
    path: ../streamless_bloc_concurrency
